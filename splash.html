<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Journey</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: var(--background, #161616);
            color: var(--text-primary, #222);
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            scrollbar-width: thin;
            scrollbar-color: var(--accent-color,#f472b6) var(--background,#fafafa);
        }
        ::-webkit-scrollbar {
            width: 10px;
            background: var(--background, #1b1b1b);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--accent-color, #f472b6) 70%, var(--card-bg, #fff) 100%);
            border-radius: 9px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--accent-hover, #db2777) 85%, var(--card-bg, #fff) 100%);
        }

        /* Fix iOS wide date input issue */
        input[type="date"] {
            max-width: 220px;
            width: 100%;
            box-sizing: border-box;
        }
        @media (max-width: 450px) {
            input[type="date"] {
                max-width: 100%;
            }
        }
    </style>
</head>  
<body>
    <main class="container">
        <section id="setupSection" class="card">
            <h2>Set Our Start Date</h2>
            <div class="input-group">
                <input type="date" id="startDateInput" required>
                <button id="saveDateBtn" class="primary-btn">Save Date</button>
            </div>
        </section>

        <section id="photoSection" class="photo-wrapper hidden">
            <div class="photo-container" id="photoContainer">
                <img id="uploadedImage" src="" alt="Couple Photo" class="hidden">
                <div id="photoPlaceholder" class="placeholder">
                    <p>Tap to Upload Photo</p>
                </div>
            </div>
            <input type="file" id="photoUpload" accept="image/*" class="hidden">
        </section>

        <section id="timerSection" class="card hidden">
            <p class="subtitle">We have been together for</p>
            <ul id="durationList" class="duration-list"></ul>
            
            <div class="alt-stats">
                <p class="subtitle mt-3">In other words...</p>
                <div id="altStatsContainer"></div>
            </div>
        </section>

        <section id="anniversarySection" class="hidden">
            </section>
    </main>

    <script src="ui.js"></script>

    <script src="navbar.js"></script>
    <script src="milestones.js"></script>
    <script src="app.js"></script>
</body>
</html>
