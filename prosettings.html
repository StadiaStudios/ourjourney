<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Journey - Pro Settings</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <script>
        // Verification & Theme Application
        (function() {
            const isUnlocked = localStorage.getItem('__app_premium_unlocked') === "true";
            const expiry = parseInt(localStorage.getItem('__app_premium_expiry') || "0");
            const now = Date.now();
            
            // Security check: If not pro or session expired, kick back to themes
            if (!isUnlocked || now >= expiry) {
                window.location.href = 'themes.html';
            }

            // Apply custom theme if active
            const themeFile = localStorage.getItem('__app_custom_theme_file');
            if (themeFile) {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = themeFile;
                document.head.appendChild(link);
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base styles (Light Mode) */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }
        
        header {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .glass-panel {
            background: rgba(243, 244, 246, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* Dark Mode Overrides */
        body.dark {
            background-color: #111111;
            color: #f3f4f6;
        }

        body.dark header {
            background-color: rgba(17, 17, 17, 0.7);
        }

        body.dark .glass-panel {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.dark .text-white-target { color: white; }
        body.dark .text-gray-400-target { color: #9ca3af; }

        .toggle-dot {
            transition: all 0.3s ease-in-out;
        }
        input:checked ~ .toggle-dot {
            transform: translateX(100%);
            background-color: #db2777;
        }
        input:checked ~ .toggle-bg {
            background-color: #4b162c;
        }
    </style>
</head>
<body class="p-6">
    <div class="w-full max-w-md">
       
        <header class="fixed top-0 left-0 w-full z-50 shadow-lg p-4 text-center border-b border-pink-400 flex justify-between items-center">
            <a href="splash.html" class="text-gray-500 hover:text-pink-600 transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left">
                    <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
                </svg>
            </a>
            <h1 class="text-2xl font-extrabold text-pink-700" id="mainTitle">SETTINGS</h1>
            <div class="w-8"></div>
        </header>

        <br><br><br>

        <!-- Pro Features Section -->
        <div class="glass-panel p-6 rounded-3xl space-y-6">
            <div class="flex items-center justify-between">
                <div class="pr-4">
                    <h3 class="font-semibold text-white-target">Hide Pro Banner</h3>
                    <p class="text-xs text-gray-400-target mt-1">
                        Permanently hide the "Get Pro" banner at the bottom of the screen, even if your session expires.
                    </p>
                </div>
                
                <label for="hideBannerToggle" class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="hideBannerToggle" class="sr-only">
                        <div class="toggle-bg block bg-gray-700 w-12 h-7 rounded-full"></div>
                        <div class="toggle-dot absolute left-1 top-1 bg-white w-5 h-5 rounded-full shadow-md"></div>
                    </div>
                </label>
            </div>
            
            <div class="pt-4 border-t border-white/5">
                <p class="text-[10px] text-gray-500 uppercase tracking-widest text-center">
                    Active Pro Account • No Ads
                </p>
            </div>
        </div>

        <p class="text-center mt-12 text-sm text-gray-500 px-6 italic">
            "Thank you for supporting Our Journey. More exclusive pro features are being developed."
        </p>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-10 opacity-0 pointer-events-none transition-all duration-300 transform translate-y-4 bg-white text-black px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2">
        <span id="toast-msg"></span>
    </div>

    <script>
        const STORAGE_KEY_HIDE_BANNER = '__app_hide_pro_banner';
        const STORAGE_KEY_THEME = '__app_theme';
        const toggle = document.getElementById('hideBannerToggle');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        // Apply Global Theme Logic
        function applyGlobalTheme() {
            const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
        }

        // Initial State
        applyGlobalTheme();
        const isHidden = localStorage.getItem(STORAGE_KEY_HIDE_BANNER) === 'true';
        toggle.checked = isHidden;

        function showToast(message) {
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }

        toggle.addEventListener('change', (e) => {
            const active = e.target.checked;
            localStorage.setItem(STORAGE_KEY_HIDE_BANNER, active);
            showToast(active ? "Banner Hidden" : "Banner Restored");
        });
    </script>
</body>
</html>
