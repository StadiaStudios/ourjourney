<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings | Our Journey</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: var(--background, #161616);
            color: var(--text-primary, #222);
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color,#f472b6) var(--background,#fafafa);
        }
        ::-webkit-scrollbar {
            width: 10px;
            background: var(--background, #1b1b1b);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--accent-color, #f472b6) 70%, var(--card-bg, #fff) 100%);
            border-radius: 9px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--accent-hover, #db2777) 85%, var(--card-bg, #fff) 100%);
        }
        .settings-wrapper {
            max-width: 400px;
            margin: 3rem auto;
            background: var(--card-bg, #fff);
            border-radius: 16px;
            box-shadow: 0 2px 16px rgb(60 60 60 / 10%);
            padding: 2.5rem 2rem;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color, #f472b6) var(--card-bg, #fff);
        }
        .settings-wrapper::-webkit-scrollbar {
            width: 8px;
            background: var(--card-bg, #fff);
        }
        .settings-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent-color, #f472b6);
            border-radius: 8px;
        }
        .settings-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover, #db2777);
        }
        .settings-title {
            font-size: 2rem;
            margin: 0 0 1.2rem;
            text-align: center;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .settings-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 1.06rem;
        }
        .settings-list li:not(:last-child) {
            border-bottom: 1px solid #ececec;
        }
        .settings-link, .settings-link:visited {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--accent-color, #1677ff);
            text-decoration: none;
            padding: 1rem 0 1rem 0.25rem;
            font-weight: 500;
            transition: color 0.18s;
        }
        .settings-link svg {
            opacity: 0.5;
            margin-left: 0.7em;
        }
        .settings-link:hover {
            color: #36a2ed;
        }
        .app-version {
            margin: 2rem 0 0 0;
            text-align: center;
            font-size: 0.93rem;
            color: var(--text-secondary, #888);
            letter-spacing: 0.01em;
        }
        .app-version-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.7rem 0 0.7rem 0;
            font-size: 1.02rem;
            color: var(--text-secondary, #888);
        }
        .app-version-label {
            font-weight: 600;
            margin-right: 0.5em;
        }
        .couple-names-box {
            margin: 1.5rem 0 2rem 0;
            background: var(--card-bg, #fff);
            border-radius: 12px;
            box-shadow: 0 1px 8px rgb(60 60 60 / 6%);
            padding: 1.35rem 1rem 1.5rem 1rem;
        }
        .relationship-date-box {
            margin: 0 0 2rem 0;
            background: var(--card-bg, #fff);
            border-radius: 12px;
            box-shadow: 0 1px 8px rgb(60 60 60 / 6%);
            padding: 1.35rem 1rem 1.5rem 1rem;
        }
        .couple-label,
        .relationship-date-label {
            display: block;
            color: var(--text-secondary, #888);
            margin-bottom: 0.7rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .couple-input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75em;
            margin-bottom: 1.1em;
            width: 100%;
        }
        @media (max-width: 480px) {
            .settings-wrapper {
                padding: 1.2rem 0.4rem;
            }
            .couple-names-box,
            .relationship-date-box {
                padding: 1rem 0.4rem 1.2rem 0.4rem;
            }
            .couple-input-row {
                grid-template-columns: 1fr;
                gap: 0.6em;
            }
        }
        .couple-input, .relationship-date-input {
            width: 100%;
            min-width: 0;
            padding: 0.65em 0.9em;
            border-radius: 7px;
            border: 1px solid var(--border-color, #ececec);
            background: var(--bg-color, #fff);
            color: var(--text-primary, #111);
            font-size: 1.02em;
            outline: none;
            transition: border 0.15s;
            box-sizing: border-box;
        }
        .relationship-date-input[type="date"] {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
        }
        @supports (-webkit-touch-callout: none) {
            .relationship-date-input[type="date"] {
                width: 100%;
                min-width: 0;
                max-width: 100%;
            }
        }
        .couple-input:focus, .relationship-date-input:focus {
            border-color: var(--accent-color, #f472b6);
        }
        .save-names-btn,
        .save-date-btn {
            width: 100%;
            background: var(--accent-color, #f472b6);
            border: none;
            color: #fff;
            padding: 0.7em 1.2em;
            border-radius: 7px;
            font-weight: 600;
            font-size: 1.05em;
            letter-spacing: 0.01em;
            cursor: pointer;
            margin-top: 0.4em;
            transition: background 0.16s;
        }
        .save-names-btn:hover,
        .save-date-btn:hover {
            background: var(--accent-hover, #db2777);
        }
        .save-success,
        .save-date-success {
            display: none;
            text-align: center;
            color: var(--accent-color, #f472b6);
            font-size: 0.98em;
            margin-top: 0.9em;
            font-weight: 500;
        }
        .save-success.active,
        .save-date-success.active {
            display: block;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div class="settings-wrapper">
        <div class="settings-title">Settings</div>
        <div class="app-version-row">
            <span class="app-version-label">App Version:</span>
            <span id="appVersionValue"><strong>1.10.8</strong></span>
        </div>
        <div class="relationship-date-box">
            <label class="relationship-date-label" for="relationshipStartDate">
                Relationship Start Date
            </label>
            <input type="date" id="relationshipStartDate" class="relationship-date-input" />
            <button type="button" class="save-date-btn" id="saveDateBtnSettings">
                Save Date
            </button>
            <span class="save-date-success" id="saveDateSuccessMsg">Saved!</span>
        </div>
        <div class="couple-names-box">
            <label class="couple-label" for="coupleInput1">
                Couple Names
            </label>
            <div class="couple-input-row">
                <input type="text" id="coupleInput1" class="couple-input" placeholder="Name 1" autocomplete="off" />
                <input type="text" id="coupleInput2" class="couple-input" placeholder="Name 2" autocomplete="off" />
            </div>
            <button type="button" class="save-names-btn" id="saveNamesBtn">
                Save Names
            </button>
            <span class="save-success" id="saveSuccessMsg">Saved!</span>
        </div>
        <div style="margin: 2rem 0 1.6rem 0; text-align: center;">
            <label for="themeSelect" style="font-weight: 500; font-size: 1rem; margin-bottom: 0.5rem; display: block;">
                Theme:
            </label>
            <select id="themeSelect" class="theme-select" style="padding: 0.55em 1.2em; border-radius: 7px; font-size: 1rem; border: 1px solid #ececec; background: #fff; color: black; outline: none;">
            </select>
        </div>
        <ul class="settings-list">
            <li>
                <a href="https://discord.gg/UGBFVrcKKx" class="settings-link" target="_blank" rel="noopener">
                    JOIN DISCORD
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l7-7-7-7"/></svg>
                </a>
            </li>
            <li>
                <a href="https://stadiastudios.github.io/stadia/" class="settings-link" target="_blank" rel="noopener">
                    OFFICIAL WEBSITE
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l7-7-7-7"/></svg>
                </a>
            </li>
            <li>
                <a href="tos.html" class="settings-link" target="_blank" rel="noopener">
                    TERMS OF SERVICE
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l7-7-7-7"/></svg>
                </a>
            </li>
            <li>
                <a href="mailto:stadiastudios.support@proton.me" class="settings-link">
                    CONTACT SUPPORT &nbsp;✉️
                </a>
            </li>
        </ul>
        <script src="ui.js"></script>
        <script src="navbar.js"></script>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var script = document.createElement('script');
            script.src = 'navbar.js';
            script.defer = true;
            document.body.appendChild(script);

            const COUPLE_NAMES_KEY = '__couple_names';
            const input1 = document.getElementById('coupleInput1');
            const input2 = document.getElementById('coupleInput2');
            const saveBtn = document.getElementById('saveNamesBtn');
            const successMsg = document.getElementById('saveSuccessMsg');

            const RELATIONSHIP_DATE_KEY = '__relationship_start_date';
            const dateInput = document.getElementById('relationshipStartDate');
            const saveDateBtn = document.getElementById('saveDateBtnSettings');
            const dateSuccessMsg = document.getElementById('saveDateSuccessMsg');

            try {
                const existing = localStorage.getItem(COUPLE_NAMES_KEY);
                if (existing) {
                    const names = JSON.parse(existing);
                    if (Array.isArray(names) && names.length >= 2) {
                        input1.value = names[0];
                        input2.value = names[1];
                    }
                }
            } catch (err) {}

            try {
                const existingDate = localStorage.getItem(RELATIONSHIP_DATE_KEY);
                if (existingDate) {
                    dateInput.value = existingDate;
                }
            } catch (err) {}

            saveBtn.addEventListener('click', () => {
                const name1 = input1.value.trim();
                const name2 = input2.value.trim();
                localStorage.setItem(COUPLE_NAMES_KEY, JSON.stringify([name1, name2]));
                successMsg.classList.add('active');
                setTimeout(() => successMsg.classList.remove('active'), 1400);
            });

            saveDateBtn.addEventListener('click', () => {
                const dateVal = dateInput.value;
                if (dateVal) {
                    localStorage.setItem(RELATIONSHIP_DATE_KEY, dateVal);
                    dateSuccessMsg.classList.add('active');
                    setTimeout(() => dateSuccessMsg.classList.remove('active'), 1400);
                }
            });
        });
    </script>
</body>
</html>
